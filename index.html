<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人技术博客，记录学习、分享技术心得">
  <title>我的技术博客</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 提前应用主题，避免页面闪烁（FOUC） -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body data-page="home">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Dev<span class="dot">Log</span></a>
      <div class="nav-actions">
        <ul class="nav-links">
          <li><a href="index.html" data-page="home">首页</a></li>
          <li><a href="#about" data-page="about">关于我</a></li>
        </ul>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero container">
    <h1 class="hero-title">记录学习，<span class="accent">分享技术</span></h1>
    <p class="hero-subtitle">欢迎来到我的技术博客，这里有我一路踩坑与成长的心得</p>
  </header>

  <!-- 搜索 + 分类筛选 -->
  <section class="controls container">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="search-input" type="text" placeholder="搜索文章标题、摘要或标签…" autocomplete="off">
    </div>
    <div class="categories" id="categories"></div>
  </section>

  <!-- 文章列表 -->
  <main class="container">
    <div class="articles-grid" id="articles-grid"></div>
  </main>

  <!-- 关于我 -->
  <section class="about container" id="about">
    <div class="about-avatar">👨‍💻</div>
    <div class="about-body">
      <h2>你好，我是 K</h2>
      <p>一名热爱前端与工程化的开发者，喜欢把复杂的概念讲清楚。这个博客用纯 HTML5 + CSS3 + JavaScript 搭建，用来记录我的学习笔记与踩坑经验。</p>
      <div class="skill-tags">
        <span>JavaScript</span>
        <span>TypeScript</span>
        <span>React</span>
        <span>Node.js</span>
        <span>CSS</span>
        <span>工程化</span>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 DevLog · 用 <span class="heart">♥</span> 与纯 HTML5 + CSS3 + JavaScript 构建</p>
    </div>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
